name: Frontend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs on the same branch or pull request to save resources and prevent race conditions
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate-frontend:
    name: Frontend Validation (Typecheck & Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend TypeScript type check
        run: pnpm --filter @workspace/lumora-frontend run typecheck

      - name: Run frontend automated test suite (Vitest)
        run: pnpm run test:frontend

  build-frontend:
    name: Frontend Production Build
    needs: [validate-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend production bundle
        run: pnpm run build:frontend
        env:
          PORT: 3000
          BASE_PATH: /

      - name: Verify build artifacts exist
        run: |
          test -d artifacts/lumora-frontend/dist/public
          test -f artifacts/lumora-frontend/dist/public/index.html

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lumora-frontend-dist
          path: artifacts/lumora-frontend/dist/public
          retention-days: 7

  deploy-frontend:
    name: Cloudflare Pages Deployment
    needs: [validate-frontend, build-frontend]
    # Runs ONLY on merged commits pushed directly to main; NEVER runs on pull requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Requires an environment protection rule in GitHub Settings (with Authorized Reviewer approval)
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - name: Download production build artifacts
        uses: actions/download-artifact@v4
        with:
          name: lumora-frontend-dist
          path: artifacts/lumora-frontend/dist/public

      - name: Verify production build artifacts
        run: |
          test -d artifacts/lumora-frontend/dist/public
          test -f artifacts/lumora-frontend/dist/public/index.html
          echo "Build artifact contents:"
          ls -lR artifacts/lumora-frontend/dist/public | head -30

      - name: Deploy to Cloudflare Pages
        id: deploy
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not configured in repository/environment secrets. Deployment cannot proceed."
            exit 1
          fi
          DEPLOY_OUTPUT=$(npx wrangler@latest pages deploy artifacts/lumora-frontend/dist/public \
            --project-name=lumora-interior-design \
            --branch=main \
            --commit-hash="${GITHUB_SHA}" \
            --commit-message="Deploy from GitHub Actions (${GITHUB_SHA::7})" 2>&1)
          echo "${DEPLOY_OUTPUT}"
          # Extract the deployment URL from wrangler output
          DEPLOY_URL=$(echo "${DEPLOY_OUTPUT}" | grep -oP 'https://[^\s]+\.pages\.dev' | tail -1)
          echo "deployment-url=${DEPLOY_URL}" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
