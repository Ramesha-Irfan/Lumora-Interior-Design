name: Lumora CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs on the same branch or pull request to save resources and prevent race conditions
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate-and-test:
    name: Validate and Test (Typecheck & Automated Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript type check
        run: pnpm run typecheck

      - name: Run automated test suite (Unit, Integration, API & E2E)
        run: pnpm run test

  build-production:
    name: Production Build
    needs: [validate-and-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production bundle
        run: pnpm run build
        env:
          PORT: 3000
          BASE_PATH: /

      - name: Verify build artifacts exist
        run: |
          test -d artifacts/lumora-frontend/dist/public
          test -f artifacts/lumora-frontend/dist/public/index.html

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lumora-frontend-dist
          path: artifacts/lumora-frontend/dist/public
          retention-days: 7

  deploy-production:
    name: Protected Production Deployment
    needs: [validate-and-test, build-production]
    # Runs ONLY on merged commits pushed directly to main; NEVER runs on pull requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Requires an environment protection rule in GitHub Settings (with Authorized Reviewer approval)
    environment:
      name: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - name: Download production build artifacts
        uses: actions/download-artifact@v4
        with:
          name: lumora-frontend-dist
          path: artifacts/lumora-frontend/dist/public

      - name: Verify production build artifacts
        run: |
          test -d artifacts/lumora-frontend/dist/public
          test -f artifacts/lumora-frontend/dist/public/index.html

      - name: Deploy to Cloudflare via Wrangler
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not configured in repository/environment secrets. Production deployment cannot proceed."
            exit 1
          fi
          pnpm dlx wrangler deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
