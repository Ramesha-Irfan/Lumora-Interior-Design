name: Frontend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs on the same branch or pull request to save resources and prevent race conditions
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate-frontend:
    name: Frontend Validation (Typecheck & Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend TypeScript type check
        run: pnpm --filter @workspace/lumora-frontend run typecheck

      - name: Run frontend automated test suite (Vitest)
        run: pnpm run test:frontend

  build-frontend:
    name: Frontend Production Build
    needs: [validate-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend production bundle
        run: pnpm run build:frontend
        env:
          PORT: 3000
          BASE_PATH: /

      - name: Verify build artifacts exist
        run: |
          test -d artifacts/lumora-frontend/dist/public
          test -f artifacts/lumora-frontend/dist/public/index.html

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lumora-frontend-dist
          path: artifacts/lumora-frontend/dist/public
          retention-days: 7

  
  deploy-frontend:
    name: Cloudflare Worker Deployment
    needs: [validate-frontend, build-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download verified frontend build
        uses: actions/download-artifact@v4
        with:
          name: lumora-frontend-dist
          path: artifacts/lumora-frontend/dist/public

      - name: Verify build output
        run: test -f artifacts/lumora-frontend/dist/public/index.html

      - name: Deploy to Cloudflare Worker
        run: npx wrangler@4 deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
